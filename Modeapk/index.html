<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ak Lab</title>
<style>
  :root{
    --bg:#e9edf8; --text:#3a3f63; --muted:#7b82a8;
    --sh-dark:rgba(150,162,200,.55); --sh-light:rgba(255,255,255,.95);
    --accent1:#a18cff; --accent2:#6fd3ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#262a41; --text:#eef0ff; --muted:#a2a8cf;
      --sh-dark:rgba(10,12,28,.65); --sh-light:rgba(70,78,120,.45); }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Poppins","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px 18px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  .clay{background:var(--bg);border-radius:28px;
    box-shadow:10px 10px 22px var(--sh-dark),-8px -8px 18px var(--sh-light),
      inset -6px -6px 12px rgba(0,0,0,.05),inset 6px 6px 12px rgba(255,255,255,.55)}
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 28px;margin-bottom:28px}
  .logo{display:flex;align-items:center;gap:14px}
  .logo-badge{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-size:28px;color:#fff;
    background:linear-gradient(145deg,var(--accent1),var(--accent2));
    box-shadow:6px 6px 14px var(--sh-dark),-4px -4px 10px var(--sh-light),inset -4px -4px 8px rgba(0,0,0,.15),inset 4px 4px 8px rgba(255,255,255,.4)}
  .logo h1{font-size:28px;letter-spacing:.5px}
  .logo small{color:var(--muted);font-size:12px}
  .search{flex:1;min-width:200px;max-width:380px;border:none;outline:none;padding:14px 22px;border-radius:999px;font-size:15px;color:var(--text);background:var(--bg);
    box-shadow:inset 6px 6px 12px var(--sh-dark),inset -6px -6px 12px var(--sh-light)}
  .search::placeholder{color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px}
  .tab{border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--bg);padding:12px 20px;border-radius:999px;
    box-shadow:6px 6px 12px var(--sh-dark),-5px -5px 10px var(--sh-light),inset -3px -3px 6px rgba(0,0,0,.05),inset 3px 3px 6px rgba(255,255,255,.5);transition:.2s}
  .tab:hover{transform:translateY(-2px)}
  .tab.active{color:#fff;background:linear-gradient(145deg,var(--accent1),var(--accent2));
    box-shadow:inset 4px 4px 8px rgba(0,0,0,.2),inset -3px -3px 6px rgba(255,255,255,.25)}
  .tab .count{opacity:.7;font-weight:500;margin-left:4px;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
  .card{padding:22px 22px 20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s, box-shadow .2s;
    text-decoration:none;color:inherit;display:block}
  .card:hover{transform:translateY(-6px)}
  .card:active{transform:scale(.97);box-shadow:inset 6px 6px 12px var(--sh-dark),inset -6px -6px 12px var(--sh-light)}
  .dot{width:46px;height:46px;border-radius:16px;margin-bottom:14px;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;
    box-shadow:5px 5px 10px var(--sh-dark),-3px -3px 8px var(--sh-light),inset -3px -3px 6px rgba(0,0,0,.15),inset 3px 3px 6px rgba(255,255,255,.4)}
  .card h3{font-size:17px;margin-bottom:6px;word-break:break-word}
  .card p{font-size:13px;color:var(--muted);min-height:18px}
  .go{position:absolute;right:16px;bottom:14px;font-size:18px;color:var(--muted);transition:.2s}
  .card:hover .go{transform:translateX(4px);color:var(--accent1)}
  .state{text-align:center;padding:60px 20px;color:var(--muted);font-size:16px}
  .spinner{width:46px;height:46px;border-radius:50%;margin:0 auto 16px;border:6px solid transparent;border-top-color:var(--accent1);animation:spin 1s linear infinite;
    box-shadow:4px 4px 10px var(--sh-dark),-4px -4px 10px var(--sh-light)}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{text-align:center;margin-top:50px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="clay">
    <div class="logo">
      <div class="logo-badge">⚗️</div>
      <div><h1>Ak Lab</h1><small>All your sites in one place</small></div>
    </div>
    <input id="search" class="search" type="search" placeholder="🔍  Search site name...">
  </header>

  <nav id="tabs" class="tabs"></nav>
  <main id="grid" class="grid"></main>
  <div id="state" class="state"><div class="spinner"></div>Loading...</div>

  <footer>© Ak Lab</footer>
</div>

<script>
/* ================= CONFIG ================= */
// Google Sheet ID (URL me /d/<ID>/edit). Sheet ko "Anyone with the link → Viewer" share karna zaroori hai.
// Khali chhodo to local data.json use hoga.
const SHEET_ID   = '';
const SHEET_NAME = 'Sheet1';
const FIRST_DATA_ROW = 4;            // Row 4 se data start
const LOCAL_JSON = 'data.json';      // fallback file

// 'named' = hamesha ek hi alag tab me khulega | 'same' = isi tab me | 'new' = har baar naya tab
const OPEN_MODE = 'named';
const TAB_NAME  = 'aklab_view';

// col = Site name wala column number (A=1, B=2...). Description = col+1, Link = col+2
const CATEGORIES = [
  { key:'movies', title:"Movie's & Shows",  icon:'🎬', col:2  },
  { key:'anime',  title:'Anime',            icon:'🍥', col:5  },
  { key:'manga',  title:'Manga',            icon:'📚', col:8  },
  { key:'live',   title:'Live Tv & Sports', icon:'📡', col:11 },
  { key:'paid',   title:'Paid',             icon:'💎', col:14 },
  { key:'apps',   title:'Apps',             icon:'📱', col:17 },
  { key:'github', title:'GitHub',           icon:'🐙', col:20 }
];
/* =========================================== */

const GRADIENTS = [
  'linear-gradient(145deg,#ff9a9e,#fad0c4)',
  'linear-gradient(145deg,#a18cff,#6fd3ff)',
  'linear-gradient(145deg,#f6d365,#fda085)',
  'linear-gradient(145deg,#84fab0,#8fd3f4)',
  'linear-gradient(145deg,#fbc2eb,#a6c1ee)',
  'linear-gradient(145deg,#ffb88c,#de6262)'
];

let DATA = [];
let activeKey = null;

const tabsEl   = document.getElementById('tabs');
const gridEl   = document.getElementById('grid');
const stateEl  = document.getElementById('state');
const searchEl = document.getElementById('search');

/* ---------- Data loading ---------- */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function buildFromRows(rows){
  const values = rows.slice(FIRST_DATA_ROW - 1);
  return CATEGORIES.map(cat => {
    const items = [];
    values.forEach(r => {
      const name = String(r[cat.col - 1] || '').trim();
      const desc = String(r[cat.col]     || '').trim();
      let   link = String(r[cat.col + 1] || '').trim();
      if (!name || !link) return;
      if (!/^https?:\/\//i.test(link)) link = 'https://' + link;
      items.push({ name, desc, link });
    });
    return { key:cat.key, title:cat.title, icon:cat.icon, items };
  });
}

async function loadFromSheet(){
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:csv&headers=0&sheet=' + encodeURIComponent(SHEET_NAME);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet load failed (' + res.status + '). Sheet public hai?');
  return buildFromRows(parseCSV(await res.text()));
}

async function loadFromJSON(){
  const res = await fetch(LOCAL_JSON);
  if (!res.ok) throw new Error(LOCAL_JSON + ' load nahi hui');
  return await res.json();
}

async function load(){
  if (SHEET_ID){
    try { return await loadFromSheet(); }
    catch (e) { console.warn(e); return await loadFromJSON(); }
  }
  return await loadFromJSON();
}

load().then(init).catch(err => {
  stateEl.textContent = 'Error: ' + (err && err.message ? err.message : err) +
    ' — local chalane ke liye "python -m http.server" use karo.';
});

/* ---------- UI ---------- */
function init(data){
  DATA = data || [];
  stateEl.style.display = 'none';
  activeKey = DATA.length ? DATA[0].key : null;
  renderTabs();
  renderGrid();
}

function renderTabs(){
  tabsEl.innerHTML = '';
  DATA.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab' + (cat.key === activeKey ? ' active' : '');
    b.append(cat.icon + ' ', document.createTextNode(cat.title));
    const c = document.createElement('span');
    c.className = 'count';
    c.textContent = cat.items.length;
    b.appendChild(c);
    b.onclick = () => { activeKey = cat.key; searchEl.value = ''; renderTabs(); renderGrid(); };
    tabsEl.appendChild(b);
  });
}

function renderGrid(){
  gridEl.innerHTML = '';
  const q = searchEl.value.trim().toLowerCase();
  let items;
  if (q){
    items = DATA.flatMap(c => c.items).filter(i => (i.name + ' ' + i.desc).toLowerCase().includes(q));
  } else {
    const cat = DATA.find(c => c.key === activeKey);
    items = cat ? cat.items : [];
  }

  if (!items.length){
    stateEl.style.display = 'block';
    stateEl.textContent = 'No sites found';
    return;
  }
  stateEl.style.display = 'none';

  items.forEach((it, idx) => {
    const card = document.createElement('a');
    card.className = 'card clay';
    card.href = it.link;
    card.target = OPEN_MODE === 'same' ? '_self' : OPEN_MODE === 'new' ? '_blank' : TAB_NAME;
    card.rel = 'noopener';

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = GRADIENTS[idx % GRADIENTS.length];
    dot.textContent = it.name.charAt(0).toUpperCase();

    const h = document.createElement('h3'); h.textContent = it.name;
    const p = document.createElement('p');  p.textContent = it.desc || '';
    const go = document.createElement('span'); go.className = 'go'; go.textContent = '➜';

    card.append(dot, h, p, go);
    gridEl.appendChild(card);
  });
}

searchEl.addEventListener('input', renderGrid);
</script>
</body>
</html>
