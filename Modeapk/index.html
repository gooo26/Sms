<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ak Lab</title>
<link rel="icon" href="https://gooo26.github.io/P/IMG_20260412_151642.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e4e9f5;
    --text:#262b4d; --muted:#6c7396;
    --accent1:#7c6cff; --accent2:#3fc1f0;
    --glass:rgba(255,255,255,.42);
    --glass-strong:rgba(255,255,255,.6);
    --glass-border:rgba(255,255,255,.7);
    --sh-dark:rgba(139,152,196,.5);
    --sh-light:rgba(255,255,255,.95);
    --orb1:rgba(124,108,255,.35); --orb2:rgba(63,193,240,.35); --orb3:rgba(255,154,190,.30);
    --focus:#5a49f0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1e33;
      --text:#eceeff; --muted:#a0a6cf;
      --glass:rgba(40,45,78,.45);
      --glass-strong:rgba(54,60,100,.6);
      --glass-border:rgba(255,255,255,.12);
      --sh-dark:rgba(6,8,22,.7);
      --sh-light:rgba(70,78,125,.35);
      --orb1:rgba(124,108,255,.30); --orb2:rgba(63,193,240,.22); --orb3:rgba(255,120,170,.16);
      --focus:#a99dff;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding:28px 18px 60px;position:relative;overflow-x:hidden;line-height:1.5;
  }
  /* soft colour orbs behind the glass so the blur has something to show */
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
  body::before{width:520px;height:520px;top:-140px;left:-120px;background:radial-gradient(circle,var(--orb1),transparent 70%)}
  body::after{width:560px;height:560px;bottom:-180px;right:-140px;background:radial-gradient(circle,var(--orb2),transparent 70%)}
  .orb3{position:fixed;z-index:-1;width:420px;height:420px;top:38%;left:55%;border-radius:50%;filter:blur(90px);pointer-events:none;background:radial-gradient(circle,var(--orb3),transparent 70%)}

  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .wrap{max-width:1180px;margin:0 auto}

  /* ===== Neumorphic + glass surface ===== */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--glass-border);
    border-radius:26px;
    box-shadow:
      9px 9px 22px var(--sh-dark),
      -7px -7px 18px var(--sh-light),
      inset 1px 1px 0 rgba(255,255,255,.35);
  }

  /* ===== Header ===== */
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 26px;margin-bottom:26px}
  .logo{display:flex;align-items:center;gap:16px}
  .logo-badge{
    width:62px;height:62px;border-radius:50%;padding:3px;flex:none;position:relative;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent1),var(--accent2));
    box-shadow:6px 6px 14px var(--sh-dark),-5px -5px 12px var(--sh-light),inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .logo-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--glass-strong);background:var(--bg)}
  .logo-badge .fallback{display:none;font-size:26px;color:#fff}
  .logo-badge.no-img img{display:none}
  .logo-badge.no-img .fallback{display:block}
  .logo h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
  .logo small{color:var(--muted);font-size:13px;font-weight:500}

  .search-box{flex:1;min-width:220px;max-width:400px;position:relative}
  .search-box svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
  .search{
    width:100%;border:1px solid transparent;outline:none;padding:14px 20px 14px 46px;border-radius:999px;font:500 15px inherit;font-family:inherit;color:var(--text);
    background:var(--glass-strong);
    box-shadow:inset 6px 6px 12px var(--sh-dark),inset -6px -6px 12px var(--sh-light);
    transition:border-color .2s;
  }
  .search:focus-visible{outline:none;border-color:var(--focus)}
  .search::placeholder{color:var(--muted)}

  /* ===== Tabs ===== */
  .tabs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
  .tab{
    border:1px solid var(--glass-border);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);
    padding:11px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:6px 6px 13px var(--sh-dark),-5px -5px 11px var(--sh-light);
    transition:transform .2s,box-shadow .2s,color .2s;
  }
  .tab:hover{transform:translateY(-2px)}
  .tab .count{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--glass-strong);color:var(--muted);
    box-shadow:inset 2px 2px 4px var(--sh-dark),inset -2px -2px 4px var(--sh-light)}
  .tab.active{
    color:#fff;border-color:rgba(255,255,255,.35);
    background:linear-gradient(145deg,var(--accent1),var(--accent2));
    box-shadow:inset 4px 4px 9px rgba(0,0,0,.22),inset -3px -3px 7px rgba(255,255,255,.28);
    transform:none;
  }
  .tab.active .count{background:rgba(255,255,255,.25);color:#fff;box-shadow:none}

  /* ===== Section heading ===== */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 6px 18px}
  .section-head h2{font-size:20px;font-weight:700;letter-spacing:-.2px}
  .section-head span{font-size:13px;color:var(--muted);font-weight:500}

  /* ===== Cards ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
  .card{
    padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
    color:inherit;text-decoration:none;cursor:pointer;
    transition:transform .22s,box-shadow .22s;
  }
  .card::before{ /* glass sheen */
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 45%);
  }
  .card:hover{transform:translateY(-5px)}
  .card:active{transform:scale(.98);box-shadow:inset 6px 6px 12px var(--sh-dark),inset -6px -6px 12px var(--sh-light)}
  .card-top{display:flex;align-items:center;gap:14px;position:relative}
  .dot{
    width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden;
    font-weight:800;font-size:20px;color:#fff;
    box-shadow:inset 4px 4px 9px rgba(0,0,0,.2),inset -3px -3px 7px rgba(255,255,255,.3);
  }
  .dot.has-icon{background:var(--glass-strong)!important;box-shadow:inset 5px 5px 10px var(--sh-dark),inset -5px -5px 10px var(--sh-light)}
  .dot img{width:28px;height:28px;object-fit:contain;display:block}
  .card h3{font-size:16px;font-weight:700;letter-spacing:-.1px;word-break:break-word;line-height:1.3}
  .card .host{font-size:12px;color:var(--muted);font-weight:500;word-break:break-all}
  .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;min-height:28px}
  .chip{font-size:12px;font-weight:600;color:var(--muted);padding:5px 12px;border-radius:999px;background:var(--glass-strong);
    box-shadow:inset 2px 2px 5px var(--sh-dark),inset -2px -2px 5px var(--sh-light);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .go{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin-left:auto;color:var(--muted);
    background:var(--glass-strong);box-shadow:3px 3px 7px var(--sh-dark),-3px -3px 7px var(--sh-light);transition:.2s;
  }
  .go svg{width:15px;height:15px}
  .card:hover .go{color:#fff;background:linear-gradient(145deg,var(--accent1),var(--accent2))}

  /* ===== States ===== */
  .state{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;font-weight:500}
  .spinner{width:44px;height:44px;border-radius:50%;margin:0 auto 16px;border:5px solid transparent;border-top-color:var(--accent1);animation:spin 1s linear infinite;
    box-shadow:4px 4px 10px var(--sh-dark),-4px -4px 10px var(--sh-light)}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{text-align:center;margin-top:50px;color:var(--muted);font-size:12px;font-weight:500}

  @media (max-width:560px){
    body{padding:16px 12px 40px}
    header{padding:16px}
    .logo h1{font-size:22px}
    .search-box{max-width:none;flex-basis:100%}
    .grid{gap:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation-duration:.01ms!important}
    html{scroll-behavior:auto}
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass,.tab{background:var(--glass-strong)}
  }
</style>
</head>
<body>
<div class="orb3" aria-hidden="true"></div>
<div class="wrap">
  <header class="glass">
    <div class="logo">
      <div class="logo-badge" id="logoBadge">
        <img src="https://gooo26.github.io/P/IMG_20260412_151642.jpg" alt="Ak Lab logo" width="62" height="62">
        <span class="fallback" aria-hidden="true">⚗️</span>
      </div>
      <div><h1>Ak Lab</h1><small>All your sites in one place</small></div>
    </div>
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" class="search" type="search" placeholder="Search site name..." aria-label="Search sites">
    </label>
  </header>

  <nav id="tabs" class="tabs" aria-label="Categories"></nav>
  <div id="sectionHead" class="section-head" style="display:none"><h2></h2><span></span></div>
  <main id="grid" class="grid"></main>
  <div id="state" class="state"><div class="spinner"></div>Loading...</div>

  <footer>© Ak Lab</footer>
</div>

<script>
/* ================= CONFIG ================= */
// Google Sheet ID (URL me /d/<ID>/edit). Sheet ko "Anyone with the link → Viewer" share karna zaroori hai.
// Khali chhodo to local data.json use hoga.
const SHEET_ID   = '';
const SHEET_NAME = 'Sheet1';
const FIRST_DATA_ROW = 4;            // Row 4 se data start
const LOCAL_JSON = 'data.json';      // fallback file

// 'named' = hamesha ek hi alag tab me khulega | 'same' = isi tab me | 'new' = har baar naya tab
const OPEN_MODE = 'named';
const TAB_NAME  = 'aklab_view';

// col = Site name wala column number (A=1, B=2...). Description = col+1, Link = col+2
const CATEGORIES = [
  { key:'movies', title:"Movie's & Shows",  icon:'🎬', col:2  },
  { key:'anime',  title:'Anime',            icon:'🍥', col:5  },
  { key:'manga',  title:'Manga',            icon:'📚', col:8  },
  { key:'live',   title:'Live Tv & Sports', icon:'📡', col:11 },
  { key:'paid',   title:'Paid',             icon:'💎', col:14 },
  { key:'apps',   title:'Apps',             icon:'📱', col:17 },
  { key:'github', title:'GitHub',           icon:'🐙', col:20 }
];
/* =========================================== */

const GRADIENTS = [
  'linear-gradient(145deg,#ff9a9e,#f7a58c)',
  'linear-gradient(145deg,#8f7cff,#4fc3f7)',
  'linear-gradient(145deg,#f6c453,#fd8f6b)',
  'linear-gradient(145deg,#4fd6a0,#5bb8e8)',
  'linear-gradient(145deg,#f58bcf,#7a9be0)',
  'linear-gradient(145deg,#ff9b6b,#d95a73)'
];

let DATA = [];
let activeKey = null;

const tabsEl   = document.getElementById('tabs');
const gridEl   = document.getElementById('grid');
const stateEl  = document.getElementById('state');
const searchEl = document.getElementById('search');
const headEl   = document.getElementById('sectionHead');

/* logo fallback if the image can't load */
(function(){
  const badge = document.getElementById('logoBadge');
  const img = badge.querySelector('img');
  img.addEventListener('error', () => badge.classList.add('no-img'));
})();

/* ---------- Data loading ---------- */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function buildFromRows(rows){
  const values = rows.slice(FIRST_DATA_ROW - 1);
  return CATEGORIES.map(cat => {
    const items = [];
    values.forEach(r => {
      const name = String(r[cat.col - 1] || '').trim();
      const desc = String(r[cat.col]     || '').trim();
      let   link = String(r[cat.col + 1] || '').trim();
      if (!name || !link) return;
      if (!/^https?:\/\//i.test(link)) link = 'https://' + link;
      items.push({ name, desc, link });
    });
    return { key:cat.key, title:cat.title, icon:cat.icon, items };
  });
}

async function loadFromSheet(){
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:csv&headers=0&sheet=' + encodeURIComponent(SHEET_NAME);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet load failed (' + res.status + '). Sheet public hai?');
  return buildFromRows(parseCSV(await res.text()));
}

async function loadFromJSON(){
  const res = await fetch(LOCAL_JSON);
  if (!res.ok) throw new Error(LOCAL_JSON + ' load nahi hui');
  return await res.json();
}

async function load(){
  if (SHEET_ID){
    try { return await loadFromSheet(); }
    catch (e) { console.warn(e); return await loadFromJSON(); }
  }
  return await loadFromJSON();
}

load().then(init).catch(err => {
  stateEl.textContent = 'Error: ' + (err && err.message ? err.message : err) +
    ' — local chalane ke liye "python -m http.server" use karo.';
});

/* ---------- Helpers ---------- */
// "kartoons.to" jaise links me https:// na ho to add kar deta hai (warna link relative ban jata tha)
function normalizeLink(l){
  l = String(l || '').trim();
  return /^https?:\/\//i.test(l) ? l : 'https://' + l;
}
function hostOf(l){
  try { return new URL(l).hostname.replace(/^www\./, ''); } catch(e){ return ''; }
}
const arrowSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- UI ---------- */
function init(data){
  DATA = data || [];
  stateEl.style.display = 'none';
  activeKey = DATA.length ? DATA[0].key : null;
  renderTabs();
  renderGrid();
}

function renderTabs(){
  tabsEl.innerHTML = '';
  DATA.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'tab' + (cat.key === activeKey ? ' active' : '');
    b.append(cat.icon + ' ', document.createTextNode(cat.title));
    const c = document.createElement('span');
    c.className = 'count';
    c.textContent = cat.items.length;
    b.appendChild(c);
    b.onclick = () => { activeKey = cat.key; searchEl.value = ''; renderTabs(); renderGrid(); };
    tabsEl.appendChild(b);
  });
}

function renderGrid(){
  gridEl.innerHTML = '';
  const q = searchEl.value.trim().toLowerCase();
  let items, heading, sub;
  if (q){
    items = DATA.flatMap(c => c.items).filter(i => (i.name + ' ' + i.desc).toLowerCase().includes(q));
    heading = 'Search results';
    sub = items.length + (items.length === 1 ? ' site' : ' sites');
  } else {
    const cat = DATA.find(c => c.key === activeKey);
    items = cat ? cat.items : [];
    heading = cat ? cat.icon + ' ' + cat.title : '';
    sub = items.length + (items.length === 1 ? ' site' : ' sites');
  }

  headEl.style.display = 'flex';
  headEl.querySelector('h2').textContent = heading;
  headEl.querySelector('span').textContent = sub;

  if (!items.length){
    stateEl.style.display = 'block';
    stateEl.textContent = q ? 'No sites match your search' : 'No sites added here yet';
    return;
  }
  stateEl.style.display = 'none';

  items.forEach((it, idx) => {
    const link = normalizeLink(it.link);
    const host = hostOf(link);

    const card = document.createElement('a');
    card.className = 'card glass';
    card.href = link;
    card.target = OPEN_MODE === 'same' ? '_self' : OPEN_MODE === 'new' ? '_blank' : TAB_NAME;
    card.rel = 'noopener';

    const top = document.createElement('div');
    top.className = 'card-top';

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = GRADIENTS[idx % GRADIENTS.length];
    dot.textContent = it.name.trim().charAt(0).toUpperCase();

    // site ka favicon (share.google jaise redirect links par sirf letter dikhta hai)
    if (host && !/^share\.google$/i.test(host)){
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64';
      img.onload = () => { dot.classList.add('has-icon'); dot.textContent = ''; dot.appendChild(img); };
    }

    const info = document.createElement('div');
    const h = document.createElement('h3'); h.textContent = it.name.trim();
    info.appendChild(h);
    if (host && !/^share\.google$/i.test(host)){
      const hs = document.createElement('div'); hs.className = 'host'; hs.textContent = host;
      info.appendChild(hs);
    }
    top.append(dot, info);

    const bottom = document.createElement('div');
    bottom.className = 'card-bottom';
    if (it.desc){
      const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = it.desc;
      bottom.appendChild(chip);
    }
    const go = document.createElement('span'); go.className = 'go'; go.innerHTML = arrowSVG;
    bottom.appendChild(go);

    card.append(top, bottom);
    gridEl.appendChild(card);
  });
}

searchEl.addEventListener('input', renderGrid);
</script>
</body>
</html>
